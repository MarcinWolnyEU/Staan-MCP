[build-system]
# Pinned exactly: the build runs in the privileged release job, so it must not float.
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[project]
name = "staan-mcp"
version = "1.0.1"
description = "MCP server for the Staan API: web search and grounded answers over stdio or streamable HTTP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcin Wolny" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "staan", "search", "web-search", "answer", "llm", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx2",
  "pydantic>=2",
  "anyio",
]

[project.optional-dependencies]
# OAuth 2.1 resource-server gate for the HTTP transports (JWT verification via JWKS).
# 2.14 added the PyJWKClient cooldown: older versions refetch the JWKS for every token that
# carries an unknown kid, which lets anonymous callers hammer the identity provider.
oauth = ["pyjwt[crypto]>=2.14"]

[project.urls]
Homepage = "https://github.com/MarcinWolnyEU/Staan-MCP"
Issues = "https://github.com/MarcinWolnyEU/Staan-MCP/issues"
Changelog = "https://github.com/MarcinWolnyEU/Staan-MCP/blob/main/CHANGELOG.md"
Source = "https://github.com/MarcinWolnyEU/Staan-MCP"

[project.scripts]
staan-mcp = "staan_mcp.cli:main"

[dependency-groups]
test = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "pytest-randomly>=5",
  "hypothesis>=6.168",
  "inline-snapshot>=0.35",
  # tests/repo parses the workflow, Dependabot and pre-commit YAML files.
  "pyyaml>=6.0.2",
  # Needed so the optional OAuth verifier tests run.
  "pyjwt[crypto]>=2.14",
  # tests/repo runs `cz bump` in a scratch copy to prove it rewrites the standalone version.
  "commitizen>=4.19,<5",
]
lint = [
  "ruff>=0.16.9,<0.17",
  "mypy>=2.3,<3",
  "pylint>=4.1,<5",
  "radon>=6.0.1,<7",
  "xenon>=0.9.3,<1",
  "types-pyyaml>=6.0.12",
]
mutation = ["mutmut>=3.8,<4"]
# Distribution checks. CI and the release job run them from the lock file (hash-pinned), not
# through an unpinned `uvx`.
dist = [
  "twine>=7,<8",
  "check-wheel-contents>=0.6",
]
# Vulnerability audit of the exported lock (security.yml). Kept out of `dev`: CI installs it alone.
audit = ["pip-audit>=2.10,<3"]
release = [
  "commitizen>=4.19,<5",
  "prek>=0.5",
  { include-group = "dist" },
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "mutation" },
  { include-group = "release" },
]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------------------
# Ruff: every rule on, with a short list of documented opt-outs.
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# No `target-version`: ruff reads it from `requires-python`.
extend-exclude = ["docs", ".tmp"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # trailing-comma rule conflicts with the formatter
  "ISC001",  # implicit string concatenation rule conflicts with the formatter
  "D203",    # incompatible with D211 (no blank line before class docstring)
  "D213",    # incompatible with D212 (summary on the first docstring line)
  "CPY001",  # no copyright header required (the licence lives in LICENSE)
]

[tool.ruff.lint.per-file-ignores]
"fuzz/**" = [
  "S101",     # asserts are the fuzz crash oracle: a failed invariant must abort the input
]
"tests/**" = [
  "S101",     # assert is how pytest tests assert
  "PLR2004",  # magic values are fine in expected results
  "D",        # tests do not need docstrings
  "ANN401",   # fixtures may return Any
  "INP001",   # tests are not a package
  "SLF001",   # tests may exercise private helpers
  "S105",     # fake secrets in tests are deliberate
  "S106",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["staan_mcp", "hermes"]

# --------------------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# The fuzz targets import atheris only inside main(): it is not a project dependency (no Windows
# wheels) and ships no stubs, so the strict check of fuzz/ (reached through tests/) cannot see it.
[[tool.mypy.overrides]]
module = "atheris"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
jobs = 0
py-version = "3.11"
load-plugins = ["pylint.extensions.mccabe", "pylint.extensions.docparams"]
fail-under = 10.0
# Tests import `build_zipapp` (scripts/) and the helper modules that sit next to them
# (rpc_process, repo_files, ...). pytest finds them through `pythonpath` and the rootdir conftest;
# pylint only learns of a directory that is itself a command-line argument, so `pylint src tests`
# or a single test file reported E0401. `source-roots` cannot fix that: it adds only the one root
# that contains each argument. The rootdir entry lets tests import the fuzz/ package the same way.
# Paths are relative to the working directory, as for every pylint path.
init-hook = "import os, sys; sys.path[:0] = [os.path.abspath(d) for d in ('scripts', 'tests', '.')]"

[tool.pylint."messages control"]
# Import ordering is owned by ruff.
disable = ["missing-module-docstring", "wrong-import-order", "ungrouped-imports"]
enable = ["useless-suppression"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint.similarities]
# Tests repeat expected request bodies on purpose; only flag long verbatim copies.
min-similarity-lines = 12
ignore-imports = true
ignore-docstrings = true

[tool.pylint.design]
max-args = 8
# AuthConfig mirrors the eight STAAN_MCP_AUTH_* settings one to one.
max-attributes = 8

# Enforcement is done by xenon: `xenon --max-absolute B --max-modules A --max-average A src`.
[tool.radon]
cc_min = "B"
exclude = "tests/*"

# --------------------------------------------------------------------------------------
# Tests (pytest 9 native TOML configuration)
# --------------------------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# scripts/build_zipapp.py is imported by its tests; it is not part of the installed package. src/hermes
# (the Hermes plugin) is not part of it either, so the tests import it from the source tree. The
# rootdir entry makes the fuzz/ package importable so tests can drive the fuzz harnesses.
pythonpath = ["scripts", "src", "."]
log_level = "INFO"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "-p",
  "pytester",
  "--cov=staan_mcp",
  "--cov=build_zipapp",
  "--cov=hermes",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "live: talks to the real Staan API; needs STAAN_API_KEY and --run-live",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# src/hermes/__init__.py runs when Hermes imports the plugin, in a process of its own (see
# tests/integration/test_hermes_plugin_load.py); tests/live is not run by default.
omit = ["tests/live/*", "src/hermes/__init__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  '^\s*\.\.\.$',
]

# --------------------------------------------------------------------------------------
# Mutation testing (Linux, macOS or WSL only)
# --------------------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src/"]
# stdio_server.py is mutated by no one: its threads, sockets and timeouts make mutation runs slow
# and flaky, and mutmut cannot run here (no fork on Windows). Every other gate covers it.
do_not_mutate = ["src/staan_mcp/stdio_server.py"]
# mutmut copies source_paths and tests/ into mutants/ and runs pytest from there; fuzz/ is a
# repo-root package (imported by tests/unit/test_fuzz_targets.py) and must come along.
also_copy = ["fuzz/"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration"]
pytest_add_cli_args = ["--no-cov", "-p", "no:randomly"]

# --------------------------------------------------------------------------------------
# Releases
# --------------------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
# CHANGELOG.md is hand-written in Keep a Changelog format, which commitizen's generator does not
# understand (it deletes the hand-written sections). `cz bump` therefore only bumps the version
# in pyproject.toml, uv.lock, server.json, stdio_server.py and the Hermes plugin manifest, commits and tags.
update_changelog_on_bump = false
major_version_zero = true
annotated_tag = true
# stdio_server.py repeats the version: it must run from a source checkout, where there is no
# installed metadata to read it from. tests/repo/test_stdio_version.py checks it and the bump. The
# Hermes plugin manifest repeats it too, because Hermes reads it without importing anything.
version_files = [
  "server.json:version",
  "src/staan_mcp/stdio_server.py:^VERSION: ",
  "src/hermes/plugin.yaml:^version: ",
]

# --------------------------------------------------------------------------------------
# Spell checking (typos, run by pre-commit)
# --------------------------------------------------------------------------------------
[tool.typos.files]
# Captured upstream responses contain third-party text in other languages (e.g. French).
extend-exclude = ["tests/fixtures/*.json", "docs/research/**"]
