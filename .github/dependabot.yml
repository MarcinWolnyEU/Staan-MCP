version: 2
# Commit messages and PR titles are Conventional Commits (`build(deps): ...`, `ci(deps): ...`),
# so they pass the PR-title check in ci.yml.
#
# Dependabot owns every pinned revision it can parse: uv.lock, action SHAs, the Dockerfile base
# image digests and the pre-commit hook SHAs (pre-commit.ci is not used; its autoupdate would
# replace the SHA pins with tags). Pins it cannot see (for example the build backend and tool
# versions pinned in workflows) are updated by hand.
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
