name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow, so nothing is published from a commit that fails it.
  workflow_call:
    inputs:
      release:
        description: Called from the release workflow (skips the Codecov upload).
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1" # never re-resolve in CI; uv.lock is the source of truth
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"

# Jobs that run `uv sync --no-default-groups --group ...` set UV_NO_SYNC: otherwise every later
# `uv run` would sync the default `dev` group again and install the whole toolchain.
jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --no-default-groups --group lint --group test
      - run: uv lock --check
        env:
          UV_FROZEN: "0"
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pylint src tests scripts
      - name: Complexity gate (radon and xenon)
        run: |
          uv run radon cc --min B --show-complexity src
          uv run xenon --max-absolute B --max-modules A --max-average A src
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-default-groups --group test
      # pyproject.toml sets fail_under = 100 with branch coverage, so every cell must be complete.
      - name: Run tests with 100 percent line and branch coverage
        run: uv run pytest --cov-report=xml
      - name: Keep the coverage report of one cell for Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !inputs.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  codecov:
    name: Upload coverage to Codecov
    needs: test
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lowest-direct:
    name: Test lowest direct dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.11"
      - run: >-
          uv run --isolated --no-editable --no-default-groups --group test
          --resolution lowest-direct pytest --no-cov
        env:
          UV_FROZEN: "0"

  # Checks that otherwise run only as local pre-commit hooks: typos, server.json against the
  # registry schema, workflow and Dependabot schemas, uv.lock, and the PR title.
  metadata:
    name: Project metadata and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - name: Check pyproject.toml and server.json versions agree
        run: |
          version="$(uv version --short)"
          jq -e --arg v "${version}" '.version == $v and (.packages | all(.version == $v))' server.json
      # prek is locked in the `release` group. mypy, pylint and xenon need the project
      # environment and run in the lint job.
      - name: Run the pre-commit hooks on every file
        env:
          SKIP: mypy,pylint,xenon
        run: uv run --only-group release prek run --all-files --show-diff-on-failure
      - name: Check the pull request title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --only-group release cz check --message "${PR_TITLE}"

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv build --no-sources
      - run: uv run --only-group dist twine check --strict dist/*
      - run: uv run --only-group dist check-wheel-contents dist/*.whl
      - name: Smoke-test the built wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl staan-mcp --version
      # Not named `dist`: release.yml calls this workflow and uploads its own `dist` artifact in
      # the same run, and artifact names must be unique within a run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-dist
          path: dist/

  docker:
    name: Docker build and smoke test (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: staan-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and reports its version
        run: docker run --rm staan-mcp:ci --version
      - name: The default command fails closed without access control
        run: |
          status=0
          docker run --rm staan-mcp:ci || status=$?
          test "${status}" -eq 2

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, lowest-direct, metadata, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
